services:
  api:
    build:
      context: .
      args:
        ENABLE_TRANSCRIPTION: ${EARSPACE_WHISPER_ENABLED:-false}
    image: earspace:local
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      EARSPACE_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - earspace-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
  worker:
    image: earspace:local
    init: true
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      EARSPACE_DATA_DIR: /data
      HF_HOME: /data/models
    volumes:
      - earspace-data:/data
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
volumes:
  earspace-data:
