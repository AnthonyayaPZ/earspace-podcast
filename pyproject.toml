[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earspace"
version = "0.1.0"
description = "Personal bilingual podcast discovery and listening backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "yt-dlp[default]>=2025.10.14",
  "psutil>=6,<8",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1,<2"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
required-version = ">=0.10.4"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
